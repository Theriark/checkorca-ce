name: CI

# Merge gate for checkorca-ce (the required checks of phase-plan-2), the Development
# deployment job and the lock-file job, in ONE workflow. This repository has exactly
# three workflows: CI, Promote - Stage and Release (docs/ci-cd.md).
#
# STRICT is "true" since phase C0 added the application (THE-1909): every check must
# run and succeed, and a skipped check fails the gate. With "false" a check whose
# input does not exist is skipped and reported as skipped, never as a pass, and the
# tripwire in `detect` fails the run if an application file exists.
#
# How CI is started: a push to a feature branch never runs this workflow. For pull
# requests the ONLY trigger is the label event, and a run does anything only for the
# label "ci-go", which the CI request broker sets. A push to development (a merge)
# runs the gate and then the deploy-development job. workflow_dispatch with mode=ci
# runs the gate by hand; mode=lock runs ONLY the lock job. Release candidates are
# tagged by Promote - Stage.
# pull_request (not pull_request_target) has a read-only token and no secrets.
on:
  push:
    branches:
      - development
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "ci runs the merge gate. lock ONLY compiles the hashed requirement files and frontend/package-lock.json and commits them to this branch."
        required: false
        default: ci
        type: choice
        options:
          - ci
          - lock

permissions:
  contents: read

# Pull request runs: one group per ref, superseded runs are cancelled, and a label
# other than ci-go gets its own unique group so it can never cancel a ci-go run.
# Every other event uses the single repository group shared with Promote - Stage and
# Release: those runs never overlap and a live deployment is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-{1}', github.ref, github.event.label.name == 'ci-go' && 'run' || github.run_id) || 'checkorca-ce-delivery' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # "true": no check may skip; any result other than success fails the gate.
  # "false": skips are tolerated only while no application file exists.
  STRICT: "true"

jobs:
  detect:
    name: Detect which inputs exist
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ci-go') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.probe.outputs.app }}
      alembic: ${{ steps.probe.outputs.alembic }}
      licence_script: ${{ steps.probe.outputs.licence_script }}
      frontend: ${{ steps.probe.outputs.frontend }}
      docker: ${{ steps.probe.outputs.docker }}
      compose_smoke: ${{ steps.probe.outputs.compose_smoke }}
      strict: ${{ steps.probe.outputs.strict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: probe
        shell: bash
        run: |
          set -euo pipefail
          case "${STRICT}" in
            true|false) ;;
            *) echo "::error::STRICT must be the literal true or false, got '${STRICT}'"; exit 1 ;;
          esac
          echo "strict=${STRICT}" >> "$GITHUB_OUTPUT"
          # In strict mode every flag is true, so a missing input makes its check
          # run and fail loudly instead of skipping.
          flag() { if [[ "${STRICT}" == "true" || -e "$2" ]]; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          flag app pyproject.toml
          flag alembic alembic.ini
          flag licence_script tools/licence_audit.py
          flag frontend frontend/package.json
          flag docker Dockerfile
          flag compose_smoke docker-compose.yml
          # Tripwire: the application must not land while STRICT is still false.
          if [[ "${STRICT}" != "true" ]]; then
            for f in pyproject.toml requirements.txt requirements-dev.txt app tests alembic.ini frontend Dockerfile docker-compose.yml tools/licence_audit.py; do
              if [[ -e "${f}" ]]; then
                echo "::error::${f} exists but STRICT is false. Set STRICT to \"true\" in .github/workflows/ci.yml."
                exit 1
              fi
            done
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    name: 1 - ruff and mypy
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - shell: bash
        run: |
          set -euo pipefail
          # Only hashed installs; pip itself is pinned in the dev lock.
          python -m pip install --require-hashes -r requirements-dev.txt
          # All three run, so one run reports every finding.
          status=0
          ruff check . || status=1
          # --diff fails like --check and prints what would change.
          ruff format --diff . || status=1
          # Strict settings for schedule, evaluator and parsers live in pyproject.toml.
          mypy app || status=1
          exit "${status}"

  test:
    name: 2 - pytest with PostgreSQL 16 and coverage
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # 16, pinned (2026-11-07)
        env:
          POSTGRES_USER: checkorca
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: checkorca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkorca -d checkorca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://checkorca:ci-only-not-a-secret@localhost:5432/checkorca_test
      SECRET_KEY: ci-only-secret-key-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - shell: bash
        run: |
          set -euo pipefail
          # Only hashed installs; pip itself is pinned in the dev lock.
          python -m pip install --require-hashes -r requirements-dev.txt
          FERNET_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::${FERNET_KEY}"
          export FERNET_KEY
          pytest -q --cov=app --cov-report= --junitxml="${RUNNER_TEMP}/pytest-junit.xml"
          # Skip guard: a lost DATABASE_URL must not turn the database tests into a
          # silent pass. No test may skip and the suite may not be empty.
          python .github/scripts/no_skips.py "${RUNNER_TEMP}/pytest-junit.xml"
          # Overall 80 percent; 95 percent for the pure domain packages. ** is needed
          # so nested subpackages are included.
          coverage report --show-missing --fail-under=80
          coverage report --fail-under=95 --include='app/schedule/**,app/evaluator/**,app/parsers/**'

  migrations:
    name: 3 - alembic up, check, down, up
    needs: detect
    if: needs.detect.outputs.app == 'true' && needs.detect.outputs.alembic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # 16, pinned (2026-11-07)
        env:
          POSTGRES_USER: checkorca
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: checkorca_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkorca -d checkorca_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://checkorca:ci-only-not-a-secret@localhost:5432/checkorca_migrate
      SECRET_KEY: ci-only-secret-key-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - shell: bash
        run: |
          set -euo pipefail
          # Only hashed installs; pip itself is pinned in the dev lock.
          python -m pip install --require-hashes -r requirements-dev.txt
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head

  frontend:
    name: 4 - frontend lint, types, Vitest, Playwright with axe
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - shell: bash
        run: |
          set -euo pipefail
          # No package install scripts; Playwright installs its browser below.
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npm run test
          npx playwright install --with-deps chromium
          # Playwright writes screenshots at 1440, 768 and 390 to frontend/screenshots.
          npm run e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: frontend/screenshots
          if-no-files-found: ignore
          retention-days: 14

  audit:
    # pip-audit has no severity filter: it fails on ANY known vulnerability, which is
    # stricter than "medium or higher". npm audit fails from moderate up through
    # tools/npm_audit_gate.py. Exceptions are recorded IDs with a reason; an npm
    # exception only covers packages that are development-only in the lock file.
    name: 5 - pip-audit and npm audit
    needs: detect
    if: needs.detect.outputs.app == 'true' || needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: ${{ needs.detect.outputs.app }}
      FRONTEND: ${{ needs.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - shell: bash
        run: |
          set -euo pipefail
          if [[ "${APP}" == "true" ]]; then
            # pip-audit from the hashed dev lock, in its own environment.
            python -m venv "${RUNNER_TEMP}/audit-env"
            "${RUNNER_TEMP}/audit-env/bin/python" -m pip install --require-hashes -r requirements-dev.txt
            ARGS=()
            if [[ -f .pip-audit-exceptions ]]; then
              while read -r id _; do
                [[ -z "${id}" || "${id}" == \#* ]] && continue
                ARGS+=(--ignore-vuln "${id}")
              done < .pip-audit-exceptions
            fi
            "${RUNNER_TEMP}/audit-env/bin/pip-audit" --require-hashes -r requirements.txt "${ARGS[@]}"
          fi
          if [[ "${FRONTEND}" == "true" ]]; then
            cd frontend
            # npm audit exits non-zero on findings; the gate decides.
            npm audit --json > "${RUNNER_TEMP}/npm-audit.json" || true
            python ../tools/npm_audit_gate.py "${RUNNER_TEMP}/npm-audit.json" package-lock.json
          fi

  licences:
    name: 6 - SPDX licence audit (Python and npm)
    needs: detect
    if: needs.detect.outputs.licence_script == 'true' || needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_AUDIT: ${{ needs.detect.outputs.licence_script }}
      FRONTEND: ${{ needs.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - shell: bash
        run: |
          set -euo pipefail
          # Allow-list: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0,
          # Python-2.0, CNRI-Python, 0BSD, Unlicense, CC0-1.0 (rnd-report-2 5.1).
          if [[ "${PYTHON_AUDIT}" == "true" ]]; then
            python -m pip install --require-hashes -r requirements.txt
            python tools/licence_audit.py --scope runtime
            # Development packages in their own environment: the reviewed dev
            # exceptions apply only there (licence-exceptions.toml).
            python -m venv "${RUNNER_TEMP}/dev-env"
            "${RUNNER_TEMP}/dev-env/bin/python" -m pip install --require-hashes -r requirements-dev.txt
            "${RUNNER_TEMP}/dev-env/bin/python" tools/licence_audit.py --scope dev
          fi
          if [[ "${FRONTEND}" == "true" ]]; then
            (cd frontend && npm ci --ignore-scripts && npm run licence:audit)
          fi

  hygiene:
    name: 7 - no psycopg, no EE names, no committed credentials
    # Runs on every gate run, also before the application exists.
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          status=0
          # psycopg is LGPL; asyncpg is the driver (rnd-report-2 5.1).
          for lock in requirements.txt requirements-dev.txt; do
            if [[ -f "${lock}" ]] && grep -qiE '^[[:space:]]*psycopg' "${lock}"; then
              echo "::error file=${lock}::psycopg must not appear in the lock file"
              status=1
            fi
          done
          # CE contains no EE logic: no import of, or reference to, the EE package.
          if git grep -nIiE 'checkorca[_-]ee' -- app frontend/src; then
            echo "::error::the CE code references the EE package"
            status=1
          fi
          # Credential scan with gitleaks (MIT), pinned by digest, default rules: the
          # checked-out tree, then every commit of the pull request or push, so a
          # secret added and removed again inside the range is found too.
          gitleaks=(docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro"
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f)
          "${gitleaks[@]}" dir /repo --no-banner --redact || status=1
          case "${EVENT}" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              if [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
                range="${HEAD_SHA}~1..${HEAD_SHA}"
              else
                range="${PUSH_BEFORE}..${HEAD_SHA}"
              fi
              ;;
            *)
              range="$(git merge-base origin/development HEAD)..HEAD"
              ;;
          esac
          echo "gitleaks history range: ${range}"
          "${gitleaks[@]}" git /repo --no-banner --redact --log-opts="${range}" || status=1
          exit "${status}"

  docker-build:
    name: 8 - docker build (non-root)
    # The image is only built and inspected here, never pushed.
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: checkorca-ce:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image must run as non-root
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker image inspect checkorca-ce:ci --format '{{.Config.User}}')"
          [[ -n "${user}" && "${user}" != "root" && "${user}" != "0" && "${user}" != "0:0" ]] || { echo "::error::image runs as root"; exit 1; }

  compose-smoke:
    name: 9 - compose smoke test
    needs: [detect, docker-build]
    if: needs.detect.outputs.compose_smoke == 'true' && needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          set -euo pipefail
          # Throwaway values generated for this run only; nothing is reused.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "FERNET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')"
          } > .env.ci
          docker compose --env-file .env.ci up -d --build --wait
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz; then ready=true; break; fi
            sleep 2
          done
          [[ "${ready}" == "true" ]] || { echo "::error::/readyz did not answer 200 on port 8080"; exit 1; }
          # From C4 on: send one e-mail through the SMTP listener and assert it in the API.
          if [[ -f scripts/smoke.sh ]]; then bash scripts/smoke.sh; fi
      - if: failure()
        shell: bash
        run: docker compose --env-file .env.ci logs --no-color --tail 200 || true
      - if: always()
        shell: bash
        run: docker compose --env-file .env.ci down -v || true

  dco:
    name: DCO - Signed-off-by on every commit
    # Developer Certificate of Origin 1.1 (CONTRIBUTING.md). A pull request: every
    # commit in it. A push to development: the new commits, except the merge or
    # squash commits GitHub writes from an already checked pull request. Commits
    # of the lock job (github-actions[bot], its exact message, only the lock
    # files) carry no sign-off and are exempt. An
    # unsigned commit can be signed off afterwards by a later signed commit of
    # the same author (retroactive sign-off, CONTRIBUTING.md).
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          exempt_github_merges=false
          case "${EVENT}" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              exempt_github_merges=true
              if [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
                range="${HEAD_SHA}^!"
              else
                range="${PUSH_BEFORE}..${HEAD_SHA}"
              fi
              ;;
            *)
              range="$(git merge-base origin/development HEAD)..HEAD"
              ;;
          esac
          sign_off='^Signed-off-by: [^<>]+ <[^<>@[:space:]]+@[^<>@[:space:]]+>[[:space:]]*$'
          retroactive='^I, [^<>]+ <([^<>@[:space:]]+@[^<>@[:space:]]+)>, hereby add my Signed-off-by to this commit: ([0-9a-f]{40})[[:space:]]*$'
          commits="$(git rev-list --no-merges "${range}")"
          # Retroactive sign-offs: only from commits that are signed off themselves,
          # and only for commits of the same author ("author-email sha" per line).
          remediated=""
          while read -r sha; do
            [[ -n "${sha}" ]] || continue
            body="$(git show -s --format=%B "${sha}")"
            grep -qE "${sign_off}" <<<"${body}" || continue
            author="$(git show -s --format=%ae "${sha}")"
            while IFS= read -r line; do
              if [[ "${line}" =~ ${retroactive} && "${BASH_REMATCH[1]}" == "${author}" ]]; then
                remediated+="${author} ${BASH_REMATCH[2]}"$'\n'
              fi
            done <<<"${body}"
          done <<<"${commits}"
          status=0
          checked=0
          while read -r sha; do
            [[ -n "${sha}" ]] || continue
            author="$(git show -s --format=%ae "${sha}")"
            committer="$(git show -s --format=%ce "${sha}")"
            # Author fields can be forged, so a bot commit is only exempt when it is
            # exactly a lock job commit: its message, and only the lock files.
            if [[ "${author}" == "${bot}" ]]; then
              message="$(git show -s --format=%B "${sha}")"
              files="$(git show --format= --name-only "${sha}")"
              if [[ "${message}" == "Update hashed requirements lock files" && -n "${files}" ]] &&
                ! grep -qvxE 'requirements(-dev)?\.txt|frontend/package-lock\.json' <<<"${files}"; then
                echo "exempt ${sha}: lock commit of github-actions[bot]"
                continue
              fi
            fi
            # Push only, relying on the rule that nobody commits to development
            # directly (no branch protection, docs/ci-cd.md).
            if [[ "${exempt_github_merges}" == "true" && "${committer}" == "noreply@github.com" ]]; then
              echo "exempt ${sha}: written by GitHub from a checked pull request"
              continue
            fi
            checked=$((checked + 1))
            if git show -s --format=%B "${sha}" | grep -qE "${sign_off}"; then
              echo "signed ${sha}"
            elif grep -qxF "${author} ${sha}" <<<"${remediated}"; then
              echo "signed ${sha} (retroactive sign-off by ${author})"
            else
              echo "::error::commit ${sha} has no Signed-off-by line (git commit -s, see CONTRIBUTING.md)"
              status=1
            fi
          done <<<"${commits}"
          echo "DCO: ${checked} commit(s) checked in ${range}"
          exit "${status}"

  brand:
    name: Brand files - MANIFEST.sha256
    # The brand files are copied byte for byte from the approved assets. This
    # proves that no file was changed, added or dropped since.
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        working-directory: frontend/public/brand
        run: |
          set -euo pipefail
          [[ -s MANIFEST.sha256 ]] || { echo "::error::frontend/public/brand/MANIFEST.sha256 is missing"; exit 1; }
          sha256sum --strict -c MANIFEST.sha256
          listed="$(sed -E -e 's/^[0-9a-f]{64}[[:space:]]+[*]?//' -e 's#^[.]/##' MANIFEST.sha256 | sort)"
          present="$(find . -type f ! -name MANIFEST.sha256 -printf '%P\n' | sort)"
          if [[ "${listed}" != "${present}" ]]; then
            echo "::error::frontend/public/brand differs from MANIFEST.sha256"
            diff <(echo "${listed}") <(echo "${present}") || true
            exit 1
          fi
          echo "brand: $(echo "${present}" | wc -l) files match MANIFEST.sha256"

  sbom:
    name: SBOM - syft on the image, grype scan
    # SPDX SBOM of the image (legal R-4). The base image digests go to the summary.
    # The image is rebuilt from the same build cache as job 8; the plan keeps the
    # SBOM a job of its own.
    needs: [detect, docker-build]
    if: needs.detect.outputs.docker == 'true' && needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: checkorca-ce:sbom
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: checkorca-ce:sbom
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check the SBOM and record the base images
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.spdxVersion and (.packages | length > 0)' sbom.spdx.json >/dev/null || {
            echo "::error::sbom.spdx.json is not an SPDX document with packages"
            exit 1
          }
          packages="$(jq '.packages | length' sbom.spdx.json)"
          {
            echo "## checkorca-ce SBOM"
            echo
            echo "- Artefact: sbom.spdx.json (SPDX JSON from syft), ${packages} packages"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Base images, pinned by digest in the Dockerfile:"
            grep -E '^FROM ' Dockerfile | awk '{print "  - " $2}'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom.spdx.json
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
      # Vulnerability scan of every package in the image, OS layer included
      # (Debian packages, CPython, pip). Fails on a high or critical finding that
      # has a fix; reviewed exceptions in .grype.yaml. Dependabot bumps the
      # pinned base image digests (.github/dependabot.yml).
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          output-file: grype.txt
          config: .grype.yaml
      - name: Record the vulnerability scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f grype.txt ]] || { echo "no grype report"; exit 0; }
          cat grype.txt
          {
            echo "## grype scan of the image (fails on high or critical with a fix)"
            echo
            echo '```'
            head -n 60 grype.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  gate:
    name: Merge gate summary
    needs:
      - detect
      - lint
      - test
      - migrations
      - frontend
      - audit
      - licences
      - hygiene
      - docker-build
      - compose-smoke
      - dco
      - brand
      - sbom
    if: >-
      always() && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ci-go') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          STRICT: ${{ needs.detect.outputs.strict }}
        run: |
          set -euo pipefail
          {
            echo "## checkorca-ce merge gate (STRICT=${STRICT:-unknown})"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "${RESULTS}" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo
            echo "A result of \`skipped\` is not a pass. It is tolerated only while STRICT is false (see docs/ci-cd.md)."
          } >> "${GITHUB_STEP_SUMMARY}"
          if echo "${RESULTS}" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::at least one required check failed"
            exit 1
          fi
          # detect and hygiene always run, so they must succeed in either mode.
          if ! echo "${RESULTS}" | jq -e '.detect.result == "success" and .hygiene.result == "success"' >/dev/null; then
            echo "::error::detect and hygiene must succeed"
            exit 1
          fi
          if [[ "${STRICT}" == "true" ]]; then
            if ! echo "${RESULTS}" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
              echo "::error::STRICT is true: every check must succeed, a skipped check fails the gate"
              exit 1
            fi
          elif [[ "${STRICT}" != "false" ]]; then
            echo "::error::STRICT value unavailable (detect did not complete)"
            exit 1
          fi

  deploy-development:
    name: Deploy Development (build once, deploy the digest)
    # Only a merge (push) to development, and only after the whole gate succeeded.
    # Also gated on the repository variable DEPLOY_DEVELOPMENT_ENABLED, which the
    # setup broker sets when it prepares the Development runtime (dokploy_prepare):
    # until then a merge deploys nothing and pushes no image.
    needs: gate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/development' &&
      vars.DEPLOY_DEVELOPMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/theriark/checkorca-ce
      SOURCE_SHA: ${{ github.sha }}
      # Registered for this product by the setup broker (github_repo_status) once
      # Cloud & Infrastructure Operations provisioned Dokploy. Empty = not yet.
      DEV_APPLICATION_ID: ""
      DEV_HOST: ce-dev-checkorca.theriark.dev
    steps:
      - name: Require the registered Development application
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DEV_APPLICATION_ID}" =~ ^[A-Za-z0-9_-]{8,64}$ ]] || {
            echo "::error::DEV_APPLICATION_ID is not set in ci.yml; add the id registered by the setup broker before enabling deployment"
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # Built once. Only the source SHA tag is pushed (never latest); every later
          # step uses the digest.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Require a valid digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build produced no valid digest"; exit 1; }
      - id: deploy
        uses: ./.github/actions/dokploy-deploy
        with:
          application-id: ${{ env.DEV_APPLICATION_ID }}
          expected-host: ${{ env.DEV_HOST }}
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          health-url: https://${{ env.DEV_HOST }}/healthz
          expected-revision: ${{ github.sha }}
          title: Development ${{ github.sha }}
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          cf-access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Record immutable Development result
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS: ${{ steps.deploy.outputs.previous-image }}
        run: |
          set -euo pipefail
          {
            echo "## checkorca-ce deployed to Development"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${DIGEST}\`"
            echo "- Previous image (rollback target): \`${PREVIOUS:-none}\`"
            echo "- URL: https://${DEV_HOST}/"
          } >> "${GITHUB_STEP_SUMMARY}"

  lock:
    name: Lock - compile and commit hashed requirements and the npm lock
    # ONLY for workflow_dispatch with mode=lock on a same-repository feature branch.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'lock' &&
      github.event.repository.fork == false &&
      github.ref_type == 'branch' &&
      github.actor != 'github-actions[bot]' &&
      !contains(fromJSON('["main","development","stage","production"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PIP_VERSION: "25.1.1"
      PIP_TOOLS_VERSION: "7.5.0"
      # Wheels only: no package build code runs while the locks are compiled.
      PIP_ONLY_BINARY: ":all:"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          # No token in .git/config while third-party packages are resolved; only
          # the push step below receives it.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile the runtime lock, then the development lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip==${PIP_VERSION}" "pip-tools==${PIP_TOOLS_VERSION}"
          fail() {
            echo "::error::pip-compile failed: $(tail -n 12 compile.log | tr '\n' '|' | cut -c1-900)"
            exit 1
          }
          # Runtime first: requirements-dev.in uses requirements.txt as a constraint.
          # --allow-unsafe pins setuptools so pip --require-hashes can install it.
          pip-compile --generate-hashes --strip-extras --allow-unsafe --output-file requirements.txt requirements.in > compile.log 2>&1 || fail
          cat compile.log
          pip-compile --generate-hashes --strip-extras --allow-unsafe --output-file requirements-dev.txt requirements-dev.in > compile.log 2>&1 || fail
          cat compile.log
          rm -f compile.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Compile the frontend lock
        # The npm counterpart: package-lock.json resolved from frontend/package.json
        # on the registry, without running any package script.
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f frontend/package.json ]]; then
            cd frontend
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Commit changed locks to the branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add requirements.txt requirements-dev.txt
          if [[ -f frontend/package-lock.json ]]; then git add frontend/package-lock.json; fi
          if git diff --cached --quiet; then
            echo "::notice::Lock files are already up to date. Nothing committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update hashed requirements lock files"
          # The same header actions/checkout would have stored, for this push only.
          auth="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"
          {
            echo "## Lock files committed to \`${BRANCH}\`"
            echo
            echo "- New head: \`$(git rev-parse HEAD)\`"
            echo "- CI was NOT started. Request one run for this head with the CI request broker (label \`ci-go\`)."
          } >> "${GITHUB_STEP_SUMMARY}"

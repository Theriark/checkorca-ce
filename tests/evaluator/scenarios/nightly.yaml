  steps:
    - at: 2027-01-05T07:30:00Z
      state: missed
      flips: [unknown>missed]
    - at: 2027-01-05T10:30:00Z
      results:
        - {id: r1, status: success, finished: 2027-01-05T10:25:00Z, received: 2027-01-05T10:26:00Z}
      occurrences:
        2027-01-04T23:00:00Z: {state: verified, result: r1, note: late result}
      state: ok
      last_success_at: 2027-01-05T10:25:00Z
      flips: [missed>ok]
      reason: "Recovered: the run due 2027-01-04T23:00:00Z was verified (late result)"
    - at: 2027-01-05T10:31:00Z
      state: ok
      flips: []


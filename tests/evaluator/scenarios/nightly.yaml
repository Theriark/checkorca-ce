# A nightly job at 23:00 Europe/Lisbon (UTC+0 in January) with the default
# rules: max runtime 360, grace 120, escalation 30 minutes. Deadline 07:00Z,
# missed from 07:30Z. Synthetic data.

- name: nightly success is verified
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-04T22:00:00Z
      count: 0
      state: unknown
      flips: []
    - at: 2027-01-04T22:55:00Z
      occurrences: {2027-01-04T23:00:00Z: pending}
      count: 1
      flips: []
    - at: 2027-01-05T00:30:00Z
      results:
        - {id: r1, status: success, finished: 2027-01-04T23:40:00Z, received: 2027-01-04T23:41:00Z}
      occurrences:
        2027-01-04T23:00:00Z: {state: verified, result: r1, note: null}
      state: ok
      last_success_at: 2027-01-04T23:40:00Z
      flips: [unknown>ok]
      reason: The run due 2027-01-04T23:00:00Z was verified

- name: a run is pending until its deadline, then overdue
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-05T03:00:00Z
      occurrences: {2027-01-04T23:00:00Z: pending}
      state: unknown
    - at: 2027-01-05T06:59:59Z
      occurrences: {2027-01-04T23:00:00Z: pending}
    - at: 2027-01-05T07:00:00Z
      occurrences: {2027-01-04T23:00:00Z: overdue}
      state: unknown
      flips: []

- name: silence becomes missed after the escalation minutes
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-05T07:29:59Z
      occurrences: {2027-01-04T23:00:00Z: overdue}
      flips: []
    - at: 2027-01-05T07:30:00Z
      occurrences: {2027-01-04T23:00:00Z: {state: missed, result: null, note: null}}
      state: missed
      consecutive_failures: 1
      flips: [unknown>missed]
      reason: The run due 2027-01-04T23:00:00Z was missed

- name: a failed run makes the job failing
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-05T01:00:00Z
      results:
        - {id: r1, status: failed, finished: 2027-01-05T00:30:00Z, received: 2027-01-05T00:31:00Z}
      occurrences: {2027-01-04T23:00:00Z: {state: failed, result: r1}}
      state: failing
      flips: [unknown>failing]
      reason: The run due 2027-01-04T23:00:00Z failed

- name: failure then a successful retry is verified, recovered after retry
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-05T01:00:00Z
      results:
        - {id: r1, status: failed, finished: 2027-01-05T00:30:00Z, received: 2027-01-05T00:31:00Z}
      state: failing
      flips: [unknown>failing]
    - at: 2027-01-05T03:00:00Z
      results:
        - {id: r2, status: success, finished: 2027-01-05T02:40:00Z, received: 2027-01-05T02:41:00Z}
      occurrences:
        2027-01-04T23:00:00Z: {state: verified, result: r2, note: recovered after retry}
      state: ok
      flips: [failing>ok]
      reason: "Recovered: the run due 2027-01-04T23:00:00Z was verified (recovered after retry)"

- name: success then failure is failed
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-05T01:00:00Z
      results:
        - {id: r1, status: success, finished: 2027-01-05T00:10:00Z, received: 2027-01-05T00:11:00Z}
        - {id: r2, status: failed, finished: 2027-01-05T00:50:00Z, received: 2027-01-05T00:51:00Z}
      occurrences: {2027-01-04T23:00:00Z: {state: failed, result: r2}}
      state: failing
      last_success_at: null
      flips: [unknown>failing]

- name: a start without a finish runs until the deadline, then is missed
  job: {schedule: daily 23:00, created: 2027-01-04T12:00:00Z}
  steps:
    - at: 2027-01-04T23:30:00Z
      results:
        - {id: s1, status: started, started: 2027-01-04T23:00:05Z, received: 2027-01-04T23:00:06Z}
      occurrences: {2027-01-04T23:00:00Z: {state: running, result: s1}}
      state: unknown
    - at: 2027-01-05T07:00:00Z
      occurrences:
        2027-01-04T23:00:00Z: {state: overdue, result: s1, note: "started, never finished"}
    - at: 2027-01-05T07:30:00Z
      occurrences: {2027-01-04T23:00:00Z: missed}
      state: missed
      flips: [unknown>missed]
      reason: was missed (started, never finished)


  job: {schedule: daily 01:30, timezone: Europe/Lisbon, created: 2027-03-27T12:00:00Z}
  steps:
    - at: 2027-03-28T02:00:00Z
      results:
        - {id: r1, status: success, finished: 2027-03-28T01:20:00Z, received: 2027-03-28T01:21:00Z}
      occurrences: {2027-03-28T01:00:00Z: {state: verified, result: r1}}
      count: 1
      state: ok


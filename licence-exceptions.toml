# Reviewed licence exceptions for tools/licence_audit.py (merge gate check 6).
#
# The allow-list (docs/ci-cd.md): MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0,
# ISC, PSF-2.0, Python-2.0, CNRI-Python, 0BSD, Unlicense, CC0-1.0. Anything else
# needs one [[exception]] table here, read by both audits:
#
#   ecosystem  python or npm
#   package    the package name
#   licence    the SPDX identifier read in the package's licence file
#   declared   optional: the exact declaration of the package when it is not
#              the SPDX identifier (default: the licence)
#   scope      runtime (shipped in the image; also covers development use) or
#              dev (tests and build tools only, never shipped)
#   reason     why it is acceptable, and where the licence was read
#   reviewer   who reviewed it
#   date       when
#
# An exception admits one package with one declared licence in its scope. A
# copyleft licence (LGPL, GPL, AGPL, SSPL) can never be an exception, and an
# unknown licence still fails. Fonts and icons are in the same gate (legal R-5).

[[exception]]
ecosystem = "python"
package = "certifi"
licence = "MPL-2.0"
scope = "runtime"
reason = "CA bundle that httpx uses. Shipped unmodified with its licence text in THIRD_PARTY_NOTICES; the MPL-2.0 file-level terms are met by not modifying it (legal-input L-1 a, dev-work-plan decision 7). LICENSE read at certifi/python-certifi on 2026-11-18."
reviewer = "Platform and Release Engineer, THE-1909; reviewed in the pull request"
date = 2026-11-18

[[exception]]
ecosystem = "python"
package = "cffi"
licence = "MIT-0"
scope = "runtime"
reason = "MIT No Attribution: the MIT grant without the attribution condition, more permissive than MIT. Required by argon2-cffi-bindings and cryptography. LICENSE read at python-cffi/cffi on 2026-11-18. MIT-0 is not on the docs/ci-cd.md list, so it is recorded here for review."
reviewer = "Platform and Release Engineer, THE-1909; reviewed in the pull request"
date = 2026-11-18

